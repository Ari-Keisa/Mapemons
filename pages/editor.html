<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapémon - Редактор Графа (Распутай паутину)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0c29;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* ===== ТВОИ ЦВЕТА ===== */
        :root {
            --primary: #4ecdc4; --secondary: #666; --accent: #ff6b6b;
            --city-color: #ff6b6b; --route-color: #44a08d; --special-color: #9370db;
            --forest-color: #2d7a2d; --meadow-color: #4caf50; --cave-color: #8b4513;
            --island-color: #ff8c00; --mountain-color: #5d4037; --canyon-color: #64b5f6;
            --building-color: #795548; --other-color: #ffd54f; --water-color: #2980b9;
        }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ */
        .toolbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(20, 20, 40, 0.95);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            border-bottom: 2px solid var(--primary);
            gap: 20px;
        }

        .toolbar h1 { margin: 0; font-size: 1.2rem; color: var(--primary); }
        .status-counter { font-size: 1.1rem; font-weight: bold; color: #ff4757; }
        .status-counter.clear { color: #2ed573; }



        .btn-export {
            background: linear-gradient(90deg, #ff6b6b, #ff8e53);
            color: white; border: none; padding: 10px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-export:hover { transform: scale(1.05); }

        /* РАБОЧАЯ ОБЛАСТЬ И КАМЕРА */
        .workspace-wrapper {
            position: absolute;
            top: 60px; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0c29 100%);
            overflow: hidden; /* Камера управляется скриптом */
            cursor: grab;
            touch-action: none; /* Отключаем стандартные жесты браузера */
        }
        .workspace-wrapper:active { cursor: grabbing; }

        .canvas {
            position: absolute;
            top: 0; left: 0;
            width: 20000px; height: 20000px;
            transform-origin: 0 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* КНОПКИ КАМЕРЫ */
        .map-controls {
            position: fixed; bottom: 30px; right: 30px;
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
        }
        .control-btn {
            width: 45px; height: 45px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #44a08d);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white; font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .control-btn:hover { background: linear-gradient(135deg, var(--accent), #ff8e53); }

        /* ЛИНИИ */
        #svgLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
        .connection-line {
            fill: none; stroke-width: 3;
            stroke: rgba(255, 255, 255, 0.4); 
            transition: stroke 0.3s;
        }
        .connection-line.intersecting { stroke: #ff4757; stroke-width: 4; z-index: 100; }

        /* ЛОКАЦИИ (ОБЛАЧКА) */
        .location-node {
            position: absolute;
            width: 140px; height: 100px;
            transform: translate(-50%, -50%);
            cursor: grab;
            z-index: 10;
        }
        .location-node:active { cursor: grabbing; z-index: 100; filter: drop-shadow(0 0 15px rgba(255,255,255,0.8)); }
        
        .node-shape { filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.4)); pointer-events: none; }
        .node-text { pointer-events: none; user-select: none; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8); }

        @media (max-width: 600px) {
            .toolbar {
                height: auto;
                flex-direction: column;
                padding: 10px;
                gap: 5px;
                align-items: stretch;
                text-align: center;
            }
            .toolbar h1 {
                font-size: 1rem;
            }
            .workspace-wrapper {
                top: 140px; /* Approximate height of stacked toolbar */
            }
            .btn-export {
                width: 100%;
                padding: 8px;
            }
            #intersectionsCount {
                font-size: 0.9rem;
            }
        }

        /* МОДАЛКА ЭКСПОРТА */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1a1a2e; padding: 20px; border-radius: 15px; width: 80%; max-width: 800px; border: 2px solid var(--primary); display: flex; flex-direction: column; gap: 15px; }
        textarea { width: 100%; height: 400px; background: #0f0c29; color: var(--primary); border: 1px solid var(--primary); border-radius: 8px; padding: 15px; font-family: monospace; resize: none; outline: none; }
        .btn-close { background: #666; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; align-self: flex-end; }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1>🕷 Распутай паутину</h1>
        <select id="regionSelect" style="background:#1a1a2e; color:var(--primary); font-size:1rem; padding:5px; border:1px solid var(--primary); border-radius:5px;" onchange="changeRegion(this.value)">
        </select>
        <div class="status-counter" id="intersectionsCount">Считаем линии...</div>
        <button class="btn-export" onclick="exportData()">💾 СКОПИРОВАТЬ JSON</button>
    </div>

    <div class="workspace-wrapper" id="workspaceWrapper">
        <div class="canvas" id="canvas">
            <svg id="svgLayer">
                <defs>
                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="rgba(255, 255, 255, 0.4)" />
                    </marker>
                    <marker id="arrow-intersecting" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#ff4757" />
                    </marker>
                </defs>
            </svg>
            <div id="nodesLayer"></div>
        </div>
    </div>

    <div class="map-controls">
        <button class="control-btn" onclick="zoomIn()"><i class="fas fa-plus"></i></button>
        <button class="control-btn" onclick="zoomOut()"><i class="fas fa-minus"></i></button>
        <button class="control-btn" onclick="resetCamera()"><i class="fas fa-expand"></i></button>
    </div>

    <div class="modal" id="exportModal">
        <div class="modal-content">
            <h2 style="margin:0; color:var(--primary);">Готовые координаты</h2>
            <p style="margin:0; color:#aaa;">Скопируй этот код и полностью замени им содержимое файла <b>location_layout.json</b></p>
            <textarea id="exportTextarea" readonly></textarea>
            <button class="btn-close" onclick="document.getElementById('exportModal').style.display='none'">Закрыть</button>
        </div>
    </div>

    <script>
        // ===== ТВОИ ДАННЫЕ =====
        const typesConfig = {
            'city': '#ff6b6b', 'route': '#44a08d', 'special': '#9370db',
            'forest': '#2d7a2d', 'meadow': '#4caf50', 'cave': '#8b4513',
            'island': '#ff8c00', 'mountain': '#5d4037', 'canyon': '#64b5f6',
            'building': '#795548', 'other': '#ffd54f', 'water': '#2980b9'
        };

        let currentLocations = {};
        let currentConnections = [];
        let originalLayoutData = null;
        let globalLocationsData = null;
        let currentRegion = 'KANTO';
        let globalMinX = 0;
        let globalMinY = 0;
        const COORD_SCALE = 0.18; // Коэффициент сжатия расстояний (чтобы облачка были ближе)

        function getType(id, name) {
            id = id.toLowerCase();
            if(id.includes('city') || id.includes('town')) return 'city';
            if(id.includes('route') || id.includes('path')) return 'route';
            if(id.includes('cave') || id.includes('tunnel') || id.includes('rock')) return 'cave';
            if(id.includes('island') || id.includes('sea')) return 'island';
            if(id.includes('forest') || id.includes('woods') || id.includes('bush')) return 'forest';
            if(id.includes('mountain') || id.includes('mt')) return 'mountain';
            if(id.includes('water') || id.includes('fall')) return 'water';
            if(id.includes('meadow') || id.includes('valley')) return 'meadow';
            if(id.includes('mansion') || id.includes('tower')) return 'building';
            if(id.includes('canyon')) return 'canyon';
            return 'other';
        }

        // ===== ЛОГИКА КАМЕРЫ И ДРАГА =====
        const wrapper = document.getElementById('workspaceWrapper');
        const canvas = document.getElementById('canvas');
        const svgLayer = document.getElementById('svgLayer');
        const nodesLayer = document.getElementById('nodesLayer');
        
        let zoomLevel = 1;
        let panX = 0, panY = 0;
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        
        let isDraggingNode = false;
        let draggedNode = null;
        let nodeDragOffset = { x: 0, y: 0 };
        const lineElements = [];

        // ===== ГЛОБАЛЬНЫЙ МАСШТАБ ОБЛАЧКОВ =====
        let cloudScale = 1;

        // 1. ИНИЦИАЛИЗАЦИЯ
        async function initEditor() {
            try {
                const [locRes, layoutRes] = await Promise.all([
                    fetch('../json/locations.json'),
                    fetch('../json/location_layout.json')
                ]);
                globalLocationsData = await locRes.json();
                originalLayoutData = await layoutRes.json();
                const regions = new Set();
                // Добавляем только те регионы, в которых есть хотя бы один узел с связями
                for (let key in originalLayoutData.nodes) {
                    let loc = globalLocationsData[key];
                    if (loc && loc.region && loc.region !== "None") {
                        let conns = loc.connections || [];
                        let hasConnection = conns.some(target => globalLocationsData[target] && globalLocationsData[target].region === loc.region);
                        if (hasConnection) {
                            regions.add(loc.region);
                        }
                    }
                }

                const select = document.getElementById('regionSelect');
                select.innerHTML = '';
                
                const regionsArray = Array.from(regions);
                if (regionsArray.length > 0 && !regions.has(currentRegion)) {
                    currentRegion = regionsArray[0]; // Выбираем первый доступный, если текущий пустой
                }

                regionsArray.forEach(r => {
                    const opt = document.createElement('option');
                    opt.value = r;
                    opt.innerText = "Регион: " + r;
                    if (r === currentRegion) opt.selected = true;
                    select.appendChild(opt);
                });

                buildMapForRegion(currentRegion);
                // Инициализируем события камеры (единожды)
                setupCamera();
            } catch (err) {
                console.error(err);
                alert("Ошибка загрузки. Откройте файл через Live Server (или любой http сервер)!");
            }
        }

        function saveCurrentRegionChanges() {
            if (!originalLayoutData) return;
            const keys = Object.keys(currentLocations);
            keys.forEach(key => {
                const loc = currentLocations[key];
                let exportX = Math.round((loc.x - 500) / COORD_SCALE + globalMinX);
                let exportY = Math.round((loc.y - 300) / COORD_SCALE + globalMinY);
                if (!originalLayoutData.nodes[key]) originalLayoutData.nodes[key] = {};
                originalLayoutData.nodes[key].x = exportX;
                originalLayoutData.nodes[key].y = exportY;
            });
        }

        function changeRegion(newRegion) {
            saveCurrentRegionChanges();
            currentRegion = newRegion;
            buildMapForRegion(currentRegion);
        }

        function buildMapForRegion(region) {
            currentLocations = {};
            currentConnections = [];
            cloudScale = 1;

            const connectionsMap = new Set();
            const connectedNodes = new Set();
            let minX = Infinity, minY = Infinity;

            for (let key in originalLayoutData.nodes) {
                if (globalLocationsData[key] && globalLocationsData[key].region === region) {
                    let conns = globalLocationsData[key].connections || [];
                    conns.forEach(target => {
                        if (globalLocationsData[target] && globalLocationsData[target].region === region) {
                            connectedNodes.add(key);
                            connectedNodes.add(target);
                            let pair = [key, target].sort();
                            connectionsMap.add(pair[0] + "|" + pair[1]);
                        }
                    });
                }
            }

            for (let key in originalLayoutData.nodes) {
                if (globalLocationsData[key] && globalLocationsData[key].region === region) {
                    if (!connectedNodes.has(key)) continue;

                    let ru_name = globalLocationsData[key].ru_name;
                    let x = originalLayoutData.nodes[key].x;
                    let y = originalLayoutData.nodes[key].y;
                    let type = getType(key, ru_name);
                    
                    currentLocations[key] = { name: ru_name, type: type, x: x, y: y };
                    
                    if (x < minX) minX = x;
                    if (y < minY) minY = y;
                }
            }

            connectionsMap.forEach(pairStr => {
                currentConnections.push(pairStr.split('|'));
            });

            globalMinX = minX === Infinity ? 0 : minX;
            globalMinY = minY === Infinity ? 0 : minY;

            for(let key in currentLocations) {
                currentLocations[key].x = (currentLocations[key].x - globalMinX) * COORD_SCALE + 500;
                currentLocations[key].y = (currentLocations[key].y - globalMinY) * COORD_SCALE + 300;
            }

            document.getElementById('svgLayer').innerHTML = `
                <defs>
                    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="rgba(255, 255, 255, 0.4)" />
                    </marker>
                    <marker id="arrow-intersecting" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="#ff4757" />
                    </marker>
                </defs>`;
            document.getElementById('nodesLayer').innerHTML = '';

            calculateCloudScale();
            drawLines();
            drawNodes();
            // Сброс камеры
            zoomLevel = 1; panX = 0; panY = 0;
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
            updateIntersections(); 
        }

        function calculateCloudScale() {
            const testDiv = document.createElement('div');
            testDiv.style.position = 'absolute';
            testDiv.style.visibility = 'hidden';
            testDiv.style.fontFamily = 'sans-serif';
            testDiv.style.fontSize = '16px'; 
            testDiv.style.whiteSpace = 'nowrap';
            document.body.appendChild(testDiv);

            let maxW = 0;
            Object.values(currentLocations).forEach(loc => {
                const words = loc.name.split(' ');
                let line1 = loc.name;
                let line2 = "";
                if (words.length > 2) {
                    line1 = words.slice(0, 2).join(' ');
                    line2 = words.slice(2).join(' ');
                }
                
                testDiv.innerText = line1;
                if (testDiv.offsetWidth > maxW) maxW = testDiv.offsetWidth;

                if (line2) {
                    testDiv.innerText = line2;
                    if (testDiv.offsetWidth > maxW) maxW = testDiv.offsetWidth;
                }
            });
            document.body.removeChild(testDiv);

            // Текст должен помещаться в ~100px (140px минус поля)
            if (maxW > 100) {
                cloudScale = maxW / 100;
            }
        }

        // 2. ОТРИСОВКА ЛИНИЙ
        function drawLines() {
            lineElements.length = 0;
            currentConnections.forEach(([fromId, toId]) => {
                const from = currentLocations[fromId];
                const to = currentLocations[toId];
                if (from && to) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.dataset.from = fromId;
                    line.dataset.to = toId;
                    line.setAttribute("class", "connection-line");
                    line.setAttribute("marker-end", "url(#arrow)");
                    updateSingleLine(line, from, to);
                    svgLayer.appendChild(line);
                    lineElements.push(line);
                }
            });
        }

        // Вычисление отступа для стрелок (55px от центра, чтобы не лезло под облачко)
        function updateSingleLine(line, from, to) {
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist === 0) return;

            // Облачко имеет размеры 120x80 (относительно центра). Радиусы a=60, b=40. Добавим 2px для обводки.
            const a = 62 * cloudScale;
            const b = 42 * cloudScale;
            const cosx = dx / dist;
            const siny = dy / dist;
            const offset = 1 / Math.sqrt((cosx/a)*(cosx/a) + (siny/b)*(siny/b));

            const x2 = to.x - cosx * offset;
            const y2 = to.y - siny * offset;

            line.setAttribute("x1", from.x);
            line.setAttribute("y1", from.y);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
        }



        // 3. ОТРИСОВКА ТОЧЕК (ОБЛАЧЕК)
        function drawNodes() {
            Object.keys(currentLocations).forEach(key => {
                const loc = currentLocations[key];
                
                const node = document.createElement('div');
                node.className = 'location-node';
                node.dataset.id = key;
                node.style.left = loc.x + 'px';
                node.style.top = loc.y + 'px';
                
                const w = 140 * cloudScale;
                const h = 100 * cloudScale;
                node.style.width = w + 'px';
                node.style.height = h + 'px';
                
                const color = typesConfig[loc.type] || '#666';
                
                let textHtml = loc.name;
                const words = loc.name.split(' ');
                if (words.length > 2) {
                    textHtml = words.slice(0, 2).join(' ') + '<br>' + words.slice(2).join(' ');
                }
                
                node.innerHTML = `
                    <svg width="100%" height="100%" viewBox="0 0 140 100" style="position:absolute; top:0; left:0; pointer-events:none;">
                        <path d="M 20,50 Q 10,30 30,20 Q 50,10 70,20 Q 90,10 110,20 Q 130,30 120,50 Q 130,70 110,80 Q 90,90 70,80 Q 50,90 30,80 Q 10,70 20,50 Z" 
                              fill="${color}" stroke="white" stroke-width="2" style="pointer-events:auto;" class="node-shape"></path>
                    </svg>
                    <div style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center; pointer-events:none; user-select:none; z-index:2; text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8); line-height: 1.2;">
                        <span>${textHtml}</span>
                    </div>
                `;

                // Обработчик перетаскивания точки
                const pathElement = node.querySelector('.node-shape');
                // Общая функция начала перетаскивания
                function startNodeDrag(clientX, clientY) {
                    isDraggingNode = true;
                    draggedNode = node;
                    isPanning = false;
                    
                    const canvasRect = canvas.getBoundingClientRect();
                    const localMouseX = (clientX - canvasRect.left) / zoomLevel;
                    const localMouseY = (clientY - canvasRect.top) / zoomLevel;
                    
                    nodeDragOffset.x = localMouseX - loc.x;
                    nodeDragOffset.y = localMouseY - loc.y;
                }

                pathElement.addEventListener('mousedown', (e) => {
                    startNodeDrag(e.clientX, e.clientY);
                    e.stopPropagation();
                });

                // Тач-версия: начало перетаскивания узла
                pathElement.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        const t = e.touches[0];
                        startNodeDrag(t.clientX, t.clientY);
                        e.stopPropagation();
                    }
                }, { passive: true });
                
                nodesLayer.appendChild(node);
            });
        }

        // 4. УПРАВЛЕНИЕ КАМЕРОЙ И ПЕРЕТАСКИВАНИЕМ
        // Общая функция обновления позиции перетаскиваемого узла
        function moveNodeTo(clientX, clientY) {
            if (!isDraggingNode || !draggedNode) return;
            const canvasRect = canvas.getBoundingClientRect();
            let newX = (clientX - canvasRect.left) / zoomLevel - nodeDragOffset.x;
            let newY = (clientY - canvasRect.top) / zoomLevel - nodeDragOffset.y;

            newX = Math.max(-10000, Math.min(newX, 50000));
            newY = Math.max(-10000, Math.min(newY, 50000));

            draggedNode.style.left = newX + 'px';
            draggedNode.style.top = newY + 'px';

            const id = draggedNode.dataset.id;
            currentLocations[id].x = newX;
            currentLocations[id].y = newY;

            lineElements.forEach(line => {
                if (line.dataset.from === id || line.dataset.to === id) {
                    updateSingleLine(line, currentLocations[line.dataset.from], currentLocations[line.dataset.to]);
                }
            });
        }

        function finishDrag() {
            isPanning = false;
            if (isDraggingNode) {
                isDraggingNode = false;
                draggedNode = null;
                updateIntersections();
            }
        }

        // === ПИНЧ-ЗУМ: данные ===
        let pinchStartDist = 0;
        let pinchStartZoom = 1;

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getPinchCenter(touches) {
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2,
                y: (touches[0].clientY + touches[1].clientY) / 2
            };
        }

        function setupCamera() {
            // === МЫШЬ: нажали на фон ===
            wrapper.addEventListener('mousedown', (e) => {
                if (isDraggingNode) return;
                isPanning = true;
                panStart.x = e.clientX - panX;
                panStart.y = e.clientY - panY;
            });

            window.addEventListener('mouseup', finishDrag);

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    panX = e.clientX - panStart.x;
                    panY = e.clientY - panStart.y;
                    updateCanvasTransform();
                }
                moveNodeTo(e.clientX, e.clientY);
            });

            // Зум колесиком
            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                const oldZoom = zoomLevel;
                zoomLevel = Math.max(0.2, Math.min(2.5, oldZoom + delta));

                const mouseX = e.clientX - wrapper.getBoundingClientRect().left;
                const mouseY = e.clientY - wrapper.getBoundingClientRect().top;

                panX = mouseX - (mouseX - panX) * (zoomLevel / oldZoom);
                panY = mouseY - (mouseY - panY) * (zoomLevel / oldZoom);

                updateCanvasTransform();
            }, { passive: false });

            // === ТАЧСКРИН ===
            // Начало касания
            wrapper.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1 && !isDraggingNode) {
                    // Один палец — панорамирование
                    isPanning = true;
                    panStart.x = e.touches[0].clientX - panX;
                    panStart.y = e.touches[0].clientY - panY;
                } else if (e.touches.length === 2) {
                    // Два пальца — начинаем пинч-зум
                    isPanning = false;
                    isDraggingNode = false;
                    draggedNode = null;
                    pinchStartDist = getPinchDistance(e.touches);
                    pinchStartZoom = zoomLevel;
                }
            }, { passive: true });

            // Движение пальцев
            wrapper.addEventListener('touchmove', (e) => {
                e.preventDefault(); // Блокируем скролл страницы

                if (e.touches.length === 2) {
                    // Пинч-зум
                    const newDist = getPinchDistance(e.touches);
                    const oldZoom = zoomLevel;
                    zoomLevel = Math.max(0.2, Math.min(2.5, pinchStartZoom * (newDist / pinchStartDist)));

                    const center = getPinchCenter(e.touches);
                    const cx = center.x - wrapper.getBoundingClientRect().left;
                    const cy = center.y - wrapper.getBoundingClientRect().top;

                    panX = cx - (cx - panX) * (zoomLevel / oldZoom);
                    panY = cy - (cy - panY) * (zoomLevel / oldZoom);

                    updateCanvasTransform();
                    return;
                }

                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    if (isDraggingNode && draggedNode) {
                        // Перетаскиваем узел
                        moveNodeTo(t.clientX, t.clientY);
                    } else if (isPanning) {
                        // Панорамирование
                        panX = t.clientX - panStart.x;
                        panY = t.clientY - panStart.y;
                        updateCanvasTransform();
                    }
                }
            }, { passive: false });

            // Конец касания
            wrapper.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    finishDrag();
                } else if (e.touches.length === 1) {
                    // Вернулись к одному пальцу после пинча → перезапускаем панорамирование
                    isPanning = true;
                    panStart.x = e.touches[0].clientX - panX;
                    panStart.y = e.touches[0].clientY - panY;
                }
            }, { passive: true });

            wrapper.addEventListener('touchcancel', finishDrag, { passive: true });
        }

        function updateCanvasTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        }

        function zoomIn() { zoomLevel = Math.min(2.5, zoomLevel + 0.2); updateCanvasTransform(); }
        function zoomOut() { zoomLevel = Math.max(0.2, zoomLevel - 0.2); updateCanvasTransform(); }
        function resetCamera() { zoomLevel = 1; panX = 0; panY = 0; updateCanvasTransform(); }

        // 5. ИГРА: РАСПУТАЙ ПАУТИНУ
        function doIntersect(p1, q1, p2, q2) {
            function orientation(p, q, r) {
                let val = (q.y - p.y) * (r.x - q.x) - (q.x - p.x) * (r.y - q.y);
                if (val == 0) return 0;
                return (val > 0) ? 1 : 2;
            }
            let o1 = orientation(p1, q1, p2);
            let o2 = orientation(p1, q1, q2);
            let o3 = orientation(p2, q2, p1);
            let o4 = orientation(p2, q2, q1);

            // Игнорируем линии, исходящие из одной точки
            if (p1.x === p2.x && p1.y === p2.y) return false;
            if (p1.x === q2.x && p1.y === q2.y) return false;
            if (q1.x === p2.x && q1.y === p2.y) return false;
            if (q1.x === q2.x && q1.y === q2.y) return false;

            return (o1 != o2 && o3 != o4);
        }

        function updateIntersections() {
            let intersectCount = 0;
            lineElements.forEach(line => {
                line.classList.remove('intersecting');
                line.setAttribute('marker-end', 'url(#arrow)');
            });

            for (let i = 0; i < lineElements.length; i++) {
                let l1 = lineElements[i];
                let p1 = currentLocations[l1.dataset.from];
                let q1 = currentLocations[l1.dataset.to];

                for (let j = i + 1; j < lineElements.length; j++) {
                    let l2 = lineElements[j];
                    let p2 = currentLocations[l2.dataset.from];
                    let q2 = currentLocations[l2.dataset.to];

                    if (doIntersect(p1, q1, p2, q2)) {
                        l1.classList.add('intersecting');
                        l1.setAttribute('marker-end', 'url(#arrow-intersecting)');
                        l2.classList.add('intersecting');
                        l2.setAttribute('marker-end', 'url(#arrow-intersecting)');
                        intersectCount++;
                    }
                }
            }

            const counter = document.getElementById('intersectionsCount');
            if (intersectCount === 0) {
                counter.innerText = "Идеально! Пересечений нет 🎉";
                counter.className = "status-counter clear";
            } else {
                counter.innerText = `Пересечений: ${intersectCount} 🔴`;
                counter.className = "status-counter";
            }
        }

        // 6. ЭКСПОРТ
        function exportData() {
            if (!originalLayoutData) return;
            
            saveCurrentRegionChanges();
            
            let exportObj = JSON.parse(JSON.stringify(originalLayoutData));

            document.getElementById('exportTextarea').value = JSON.stringify(exportObj, null, 2);
            document.getElementById('exportModal').style.display = 'flex';
        }

        initEditor();
    </script>
</body>
